name: Actualizar tablero de calidad y placas

on:
  schedule:
    # Lunes 08:00 hora Argentina (UTC-3) = 11:00 UTC
    - cron: "0 11 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Generar tablero
        run: python3 scripts/build.py

      - name: Commit si cambió
        run: |
          git config user.name "tablero-bot"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet -- index.html; then
            echo "Sin cambios en los datos, no hago commit."
          else
            git add index.html
            git commit -m "Actualización automática semanal ($(date -u +%Y-%m-%d))"
            git push
          fi
