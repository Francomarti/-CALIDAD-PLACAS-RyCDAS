<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calidad y Placas · RyCDAS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F3EC; --bg-soft:#EDE9DD; --card:#FFFFFF; --ink:#1E1F1B; --ink-soft:#666358;
  --line:#E1DDCF; --bordo:#0F7A45; --bordo-dark:#063F22; --accent:#0B6B3A;
  --gold:#7A5E0C; --gold-tint:#FBF3D6;
  --green:#3E7A4E; --green-bg:#E7F1E7; --amber:#B8791E; --amber-bg:#FAEFDC;
  --red:#AC3A32; --red-bg:#F8E6E3; --gray-bg:#EAE7DC;
  --focus:#2F6FB0;
  --radius:10px;
  font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#161712; --bg-soft:#1D1E18; --card:#23241D; --ink:#EDEBE0; --ink-soft:#AEAA9B;
    --line:#34362B; --bordo:#0F7A45; --bordo-dark:#063F22; --accent:#5FE3A6;
    --gold:#E8C24A; --gold-tint:#332A12;
    --green:#7BBE8C; --green-bg:#1D2E20; --amber:#E0A94E; --amber-bg:#332711;
    --red:#E4776E; --red-bg:#3A201D; --gray-bg:#282A21;
  }
}
:root[data-theme="dark"]{
  --bg:#161712; --bg-soft:#1D1E18; --card:#23241D; --ink:#EDEBE0; --ink-soft:#AEAA9B;
  --line:#34362B; --bordo:#0F7A45; --bordo-dark:#063F22; --accent:#5FE3A6;
  --gold:#E8C24A; --gold-tint:#332A12;
  --green:#7BBE8C; --green-bg:#1D2E20; --amber:#E0A94E; --amber-bg:#332711;
  --red:#E4776E; --red-bg:#3A201D; --gray-bg:#282A21;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  -webkit-font-smoothing:antialiased;
  min-height:100%;
}
img,svg{max-width:100%;}
a{color:inherit;}
button{font-family:inherit;}
::selection{background:var(--bordo);color:#fff;}

/* ---------- header ---------- */
header.top{
  position:sticky; top:0; z-index:30;
  background:var(--bordo); color:#fff;
  padding-top:calc(env(safe-area-inset-top,0px) + 14px);
}
.top-inner{max-width:1180px;margin:0 auto;padding:0 18px 14px;}
.top-row{display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap;}
.brand-group{display:flex; align-items:center; gap:12px; flex-wrap:wrap;}
.logo-card{background:#fff; border-radius:8px; padding:6px 10px; display:inline-flex; align-items:center; line-height:0; box-shadow:0 1px 3px rgba(0,0,0,.18); flex:0 0 auto;}
.logo-img{height:24px; width:auto; display:block;}
.brand{font-family:'Fraunces',serif; font-weight:600; font-size:22px; letter-spacing:.2px;}
.brand small{display:block; font-family:'Inter',sans-serif; font-weight:500; font-size:12.5px; opacity:.78; letter-spacing:.2px; margin-top:2px;}
.meta{font-size:12px; opacity:.75; text-align:right;}
.search-wrap{margin-top:14px; position:relative;}
.search-wrap input{
  width:100%; padding:11px 14px 11px 38px; border-radius:9px; border:1px solid rgba(255,255,255,.25);
  background:rgba(255,255,255,.12); color:#fff; font-size:15px; outline:none;
}
.search-wrap input::placeholder{color:rgba(255,255,255,.65);}
.search-wrap input:focus{background:rgba(255,255,255,.18); border-color:rgba(255,255,255,.55);}
.search-wrap svg{position:absolute; left:12px; top:50%; transform:translateY(-50%); opacity:.65;}

/* crop tabs */
nav.crops{
  display:flex; gap:6px; overflow-x:auto; padding:12px 18px 0; max-width:1180px; margin:0 auto;
  -ms-overflow-style:none; scrollbar-width:none;
}
nav.crops::-webkit-scrollbar{display:none;}
nav.crops button{
  flex:0 0 auto; border:1px solid rgba(255,255,255,.28); background:transparent; color:#fff;
  padding:8px 14px; border-radius:999px; font-size:13.5px; font-weight:500; cursor:pointer;
  white-space:nowrap; transition:background .15s, color .15s;
}
nav.crops button .count{opacity:.7; font-size:12px; margin-left:5px;}
nav.crops button.active{background:#fff; color:var(--bordo-dark); border-color:#fff; font-weight:600;}
nav.crops button:not(.active):hover{background:rgba(255,255,255,.14);}

/* ---------- filter bar ---------- */
.filterbar{
  max-width:1180px; margin:0 auto; padding:14px 18px 0;
  display:flex; align-items:center; gap:14px; flex-wrap:wrap;
}
.chipgroup{
  display:flex; gap:6px; flex-wrap:wrap;
  padding:4px; border:1px solid var(--line); border-radius:999px;
}
.chip{
  border:1px solid var(--line); background:var(--card); color:var(--ink-soft);
  padding:6px 12px; border-radius:999px; font-size:12.5px; cursor:pointer; transition:.15s;
}
.chip.active{background:var(--bordo); border-color:var(--bordo); color:#fff;}
.spacer{flex:1;}
select#sortSel{
  border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:8px;
  padding:7px 10px; font-size:12.5px;
}
.resultcount{font-size:12.5px; color:var(--ink-soft); padding:14px 18px 0; max-width:1180px; margin:0 auto;}

/* ---------- stats strip (resumen) ---------- */
.stats{
  max-width:1180px; margin:16px auto 0; padding:0 18px;
  display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px;
}
.stat{
  background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:14px 16px;
}
.stat .n{font-family:'Fraunces',serif; font-size:26px; font-weight:600; line-height:1;}
.stat .l{font-size:12px; color:var(--ink-soft); margin-top:5px;}
.stat.warn .n{color:var(--amber);}
.stat.bad .n{color:var(--red);}
.stat.clickable{cursor:pointer; transition:box-shadow .15s, border-color .15s;}
.stat.clickable:hover{box-shadow:0 0 0 2px var(--line) inset; border-color:var(--ink-soft);}

/* ---------- main ---------- */
main{max-width:1180px; margin:0 auto; padding:16px 18px 60px;}

.pgpill{
  display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:999px; font-size:12.5px; font-weight:600; white-space:nowrap;
}
.pgpill.green{background:var(--green-bg); color:var(--green);}
.pgpill.amber{background:var(--amber-bg); color:var(--amber);}
.pgpill.red{background:var(--red-bg); color:var(--red);}
.pgpill.gray{background:var(--gray-bg); color:var(--ink-soft);}

.tablewrap{
  overflow-x:auto; border:1px solid var(--line); border-radius:var(--radius); background:var(--card);
  -webkit-overflow-scrolling:touch;
}
table.mtable{width:100%; min-width:760px; border-collapse:collapse; font-size:13px;}
table.mtable thead th{
  text-align:left; font-size:11px; font-weight:600; color:var(--ink-soft);
  padding:11px 14px; border-bottom:1px solid var(--line); background:var(--bg-soft); white-space:nowrap;
}
table.mtable thead th.num, table.mtable td.num{text-align:right;}
table.mtable tbody td{padding:10px 14px; border-bottom:1px solid var(--line); vertical-align:middle;}
table.mtable tbody tr{cursor:pointer; transition:background .1s;}
table.mtable tbody tr:hover{background:var(--bg-soft);}
table.mtable tbody tr:last-child td{border-bottom:none;}
td.mat-name{font-family:'Fraunces',serif; font-weight:600; font-size:14px; white-space:nowrap;}
td.num{font-variant-numeric:tabular-nums;}
td.crop-tag, td.suc-list{color:var(--ink-soft); font-size:12px; white-space:nowrap;}
td.chev{color:var(--ink-soft); text-align:right; font-size:15px;}
.row-status{display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:8px; flex:0 0 auto;}
.row-status.green{background:var(--green);}
.row-status.amber{background:var(--amber);}
.row-status.red{background:var(--red);}
.row-status.gray{background:var(--gray-bg);}

.empty{padding:60px 10px; text-align:center; color:var(--ink-soft);}
.empty b{display:block; font-family:'Fraunces',serif; font-size:18px; color:var(--ink); margin-bottom:6px; font-weight:600;}

/* ---------- detail panel ---------- */
.overlay{
  position:fixed; inset:0; background:rgba(20,15,12,.45); z-index:50; display:none;
  align-items:flex-end; justify-content:center;
}
.overlay.open{display:flex;}
.sheet{
  background:var(--card); width:100%; max-width:720px; max-height:88vh; overflow-y:auto;
  border-radius:16px 16px 0 0; padding:20px 20px calc(24px + env(safe-area-inset-bottom,0px));
  animation:slideup .18s ease-out;
}
@media (min-width:720px){
  .overlay{align-items:center;}
  .sheet{border-radius:16px; max-height:82vh;}
}
@keyframes slideup{from{transform:translateY(24px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.sheet-head{display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:4px;}
.sheet-head h2{font-family:'Fraunces',serif; font-size:20px; font-weight:600; margin:0;}
.sheet-head .art{font-size:12px; color:var(--ink-soft); margin-top:3px;}
.closebtn{
  border:none; background:var(--gray-bg); width:30px; height:30px; border-radius:50%; cursor:pointer;
  font-size:16px; color:var(--ink-soft); flex:0 0 auto; line-height:1;
}
.sheet-stats{display:flex; gap:8px; flex-wrap:wrap; margin:14px 0;}
.sheet-stats .box{background:var(--bg-soft); border-radius:8px; padding:8px 12px; font-size:12px; color:var(--ink-soft);}
.sheet-stats .box b{display:block; font-size:16px; color:var(--ink); font-family:'Fraunces',serif; font-weight:600;}
table.lots{width:100%; border-collapse:collapse; margin-top:6px; font-size:12.5px;}
table.lots th{
  text-align:left; font-size:11px; text-transform:none; color:var(--ink-soft); font-weight:600;
  padding:6px 8px; border-bottom:1px solid var(--line);
}
table.lots td{padding:8px; border-bottom:1px solid var(--line); vertical-align:top;}
table.lots tr:last-child td{border-bottom:none;}
.obsbox{margin-top:14px; padding:10px 12px; background:var(--bg-soft); border-radius:8px; font-size:12.5px; color:var(--ink-soft);}
.obsbox b{color:var(--ink);}
.badge{display:inline-block; padding:2px 7px; border-radius:5px; font-size:11px; font-weight:600;}
.badge.green{background:var(--green-bg); color:var(--green);}
.badge.amber{background:var(--amber-bg); color:var(--amber);}
.badge.red{background:var(--red-bg); color:var(--red);}
.badge.gray{background:var(--gray-bg); color:var(--ink-soft);}
.badge.nuevo{background:#F7CAAC; color:#7A3A0E;}
.badge.alerta{background:#D9D5D5; color:#4A4646;}
.badge.carry{background:var(--gray-bg); color:var(--ink-soft);}
.badge.anterior{background:var(--gold-tint); color:var(--gold);}
.tag-anterior{
  display:inline-block; margin-left:7px; padding:1px 7px; border-radius:5px;
  font-size:10.5px; font-weight:600; background:var(--gold-tint); color:var(--gold);
  vertical-align:middle; white-space:nowrap;
}

footer.note{max-width:1180px; margin:0 auto; padding:0 18px 40px; font-size:11.5px; color:var(--ink-soft);}

@media (prefers-reduced-motion:reduce){
  .sheet{animation:none;}
}
:focus-visible{outline:2px solid var(--focus); outline-offset:2px;}
</style>
</head>

    if(mats.length===0) return;
    const btn = document.createElement('button');
    btn.className = (!searching && crop===state.crop) ? "active" : "";
    btn.innerHTML = `${CROP_LABEL[crop]}<span class="count">${mats.length}</span>`;
    btn.onclick = () => {
      state.crop = crop; state.suc = "Todas"; state.search = "";
      document.getElementById('searchInput').value = "";
      renderAll();
    };
    nav.appendChild(btn);
  });
}

function renderSucChips(){
  const wrap = document.getElementById('sucChips');
  const sucs = sucursalesForCrop();
  wrap.innerHTML = "";
  const mk = (label,val) => {
    const c = document.createElement('div');
    c.className = "chip" + (state.suc===val ? " active" : "");
    c.textContent = label;
    c.onclick = () => { state.suc = val; renderTable(); renderStats(); };
    return c;
  };
  wrap.appendChild(mk("Todas las sucursales","Todas"));
  sucs.forEach(s => wrap.appendChild(mk(s, s)));
}

function renderEstadoChips(){
  const wrap = document.getElementById('estadoChips');
  wrap.innerHTML = "";
  const mk = (label,val) => {
    const c = document.createElement('div');
    c.className = "chip" + (state.estado===val ? " active" : "");
    c.textContent = label;
    c.onclick = () => { state.estado = val; renderTable(); renderStats(); };
    return c;
  };
  wrap.appendChild(mk("Todos los estados","Todos"));
  wrap.appendChild(mk("Nuevo","nuevo"));
  wrap.appendChild(mk("Alerta","alerta"));
  wrap.appendChild(mk("Carry","carry"));
}

function renderOrigenChips(){
  const wrap = document.getElementById('origenChips');
  wrap.innerHTML = "";
  const mk = (label,val) => {
    const c = document.createElement('div');
    c.className = "chip" + (state.origen===val ? " active" : "");
    c.textContent = label;
    c.onclick = () => { state.origen = val; renderTable(); renderStats(); };
    return c;
  };
  wrap.appendChild(mk("Todas las campañas","Todas"));
  wrap.appendChild(mk("Actual","actual"));
  wrap.appendChild(mk("Año anterior","anterior"));
}

function renderStats(){
  const wrap = document.getElementById('statsStrip');
  const sucOk = l => state.suc==="Todas" || l.suc===state.suc;
  const mats = currentPool().filter(m => state.suc==="Todas" || m.suc.includes(state.suc));
  const totalMat = mats.length;
  const totalLotes = mats.reduce((a,m)=>a + m.lotes.filter(sucOk).length, 0);
  const vencidos = mats.reduce((a,m)=>a + m.lotes.filter(l=>sucOk(l) && l.dias!==null && l.dias<0).length, 0);
  const alertas = mats.reduce((a,m)=>a + m.lotes.filter(l=>sucOk(l) && (l.estado==="alerta" || (l.pgv!==null && l.pgv!==undefined && l.pgv<80))).length, 0);
  const nuevos = mats.reduce((a,m)=>a + m.lotes.filter(l=>sucOk(l) && l.estado==="nuevo").length, 0);
  wrap.innerHTML = `
    <div class="stat"><div class="n">${totalMat}</div><div class="l">materiales</div></div>
    <div class="stat"><div class="n">${totalLotes}</div><div class="l">lotes con stock</div></div>
    <div class="stat"><div class="n">${nuevos}</div><div class="l">lotes nuevos</div></div>
    <div class="stat clickable ${alertas>0?'warn':''}" id="statAlerta"><div class="n">${alertas}</div><div class="l">lotes en alerta / PG &lt; 80% →</div></div>
    <div class="stat clickable ${vencidos>0?'bad':''}" id="statVencidos"><div class="n">${vencidos}</div><div class="l">lotes vencidos →</div></div>
  `;
  document.getElementById('statAlerta').onclick = () => openLotList(
    "Lotes en alerta",
    l => l.estado==="alerta" || (l.pgv!==null && l.pgv!==undefined && l.pgv<80)
  );
  document.getElementById('statVencidos').onclick = () => openLotList(
    "Lotes vencidos",
    l => l.dias!==null && l.dias<0
  );
}

function materialStatus(m){
  const lots = m.lotes;
  if(lots.some(l=>l.dias!==null && l.dias<0)) return "red";
  if(lots.some(l=>l.estado==="alerta")) return "red";
  if(m.pgavg!==null && m.pgavg!==undefined && m.pgavg<80) return "red";
  if(lots.some(l=>l.dias!==null && l.dias>=0 && l.dias<=90)) return "amber";
  if(m.pgavg!==null && m.pgavg!==undefined && m.pgavg<90) return "amber";
  if(m.pgavg===null || m.pgavg===undefined) return "";
  return "green";
}

function renderTable(){
  renderSucChips();
  renderEstadoChips();
  renderOrigenChips();
  const tbody = document.getElementById('matTableBody');
  const items = filteredSorted();
  const searching = isSearching();
  document.getElementById('resultCount').textContent = searching
    ? `${items.length} resultado${items.length===1?'':'s'} en todos los cultivos`
    : `${items.length} material${items.length===1?'':'es'}`;
  tbody.innerHTML = "";
  document.getElementById('emptyState').style.display = items.length? "none":"block";
  document.getElementById('tableWrap').style.display = items.length? "":"none";
  items.forEach(m => {
    const st = materialStatus(m) || "gray";
    const pgcls = pgClass(m.pgavg);
    const pgtxt = m.pgavg===null||m.pgavg===undefined ? "—" : (m.pgmin===m.pgmax ? `${fmtNum(m.pgavg)}%` : `${fmtNum(m.pgmin)}–${fmtNum(m.pgmax)}%`);
    const placaTxt = m.placas && m.placas.length ? m.placas.slice(0,2).join(" · ") : "—";
    const sucTxt = m.suc.slice(0,3).join(", ") + (m.suc.length>3 ? ` +${m.suc.length-3}` : "");
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td class="mat-name"><span class="row-status ${st}"></span>${m.desc}${origenTag(m)}</td>
      <td class="crop-tag">${CROP_LABEL[m._crop]}</td>
      <td class="num">${fmtNum(m.ex)}</td>
      <td><span class="pgpill ${pgcls}">${pgtxt}</span></td>
      <td>${placaTxt}</td>
      <td class="suc-list">${sucTxt}</td>
      <td class="chev">›</td>
    `;
    tr.onclick = () => openSheet(m);
    tbody.appendChild(tr);
  });
}

function openLotList(title, predicate){
  const sucOk = l => state.suc==="Todas" || l.suc===state.suc;
  const mats = currentPool().filter(m => state.suc==="Todas" || m.suc.includes(state.suc));
  const rows = [];
  mats.forEach(m => {
    m.lotes.forEach(l => { if(sucOk(l) && predicate(l)) rows.push({m, l}); });
  });
  rows.sort((a,b) => a.m.desc.localeCompare(b.m.desc,'es'));

  const body = rows.map(({m,l}) => {
    const vcls = vencClass(l.dias);
    const vlab = vencLabel(l.dias, l.venc);
    const pgc = pgClass(l.pgv);
    const estadoBadge = l.estado ? `<span class="badge ${l.estado}">${ESTADO_LABEL[l.estado]}</span>` : `<span style="color:var(--ink-soft)">—</span>`;
    const origenBadge = l.origen==="anterior" ? `<span class="badge anterior" style="margin-left:4px;">Año anterior</span>` : "";
    return `<tr>
      <td class="mat-name" style="font-size:13px;">${m.desc}<br><span style="font-weight:400;color:var(--ink-soft);font-size:11.5px;">${CROP_LABEL[m._crop]}</span></td>
      <td><b>${l.suc}</b><br><span style="color:var(--ink-soft)">${l.dep||""}</span></td>
      <td>${l.lote||"—"}</td>
      <td>${estadoBadge}${origenBadge}</td>
      <td><span class="badge ${pgc}">${l.pg||"—"}${l.pg?'%':''}</span></td>
      <td><span class="badge ${vcls}">${vlab}</span></td>
    </tr>`;
  }).join("");

  const sheet = document.getElementById('sheet');
  sheet.innerHTML = `
    <div class="sheet-head">
      <div><h2>${title}</h2><div class="art">${rows.length} lote${rows.length===1?'':'s'}${state.suc!=="Todas" ? " · "+state.suc : ""}</div></div>
      <button class="closebtn" id="closeBtn" aria-label="Cerrar">✕</button>
    </div>
    <div style="overflow-x:auto;">
    <table class="lots">
      <thead><tr><th>Material</th><th>Sucursal / Depósito</th><th>Lote</th><th>Estado</th><th>PG</th><th>Vencimiento</th></tr></thead>
      <tbody>${body || `<tr><td colspan="6" style="color:var(--ink-soft);padding:16px 8px;">Sin lotes en esta categoría ahora mismo.</td></tr>`}</tbody>
    </table>
    </div>
  `;
  document.getElementById('overlay').classList.add('open');
  document.getElementById('closeBtn').onclick = closeSheet;
  Array.from(sheet.querySelectorAll('tbody tr')).forEach((tr, i) => {
    if(!rows[i]) return;
    tr.style.cursor = 'pointer';
    tr.onclick = () => openSheet(rows[i].m);
  });
}

function openSheet(m){
  const sheet = document.getElementById('sheet');
  const pgcls = pgClass(m.pgavg);
  const pgtxt = m.pgavg===null||m.pgavg===undefined ? "—" : (m.pgmin===m.pgmax ? `${fmtNum(m.pgavg)}%` : `${fmtNum(m.pgmin)}–${fmtNum(m.pgmax)}%`);
  const rows = m.lotes.map(l => {
    const vcls = vencClass(l.dias);
    const vlab = vencLabel(l.dias, l.venc);
    const pgc = pgClass(l.pgv);
    const extras = [];
    if(l.cold) extras.push(`Cold test: ${l.cold}`);
    if(l.ener) extras.push(`Test energía: ${l.ener}`);
    if(l.plant) extras.push(`Plántulas vigorosas: ${l.plant}`);
    if(l.pms) extras.push(`PMS: ${l.pms}`);
    const estadoBadge = l.estado ? `<span class="badge ${l.estado}">${ESTADO_LABEL[l.estado]}</span>` : `<span style="color:var(--ink-soft)">—</span>`;
    const origenBadge = l.origen==="anterior" ? `<span class="badge anterior" style="margin-left:4px;">Año anterior</span>` : "";
    return `<tr>
      <td><b>${l.suc}</b><br><span style="color:var(--ink-soft)">${l.dep||""}</span></td>
      <td>${l.lote||"—"}</td>
      <td>${estadoBadge}${origenBadge}</td>
      <td>${fmtNum(l.ex)}</td>
      <td>${l.cond||"—"}</td>
      <td><span class="badge ${pgc}">${l.pg||"—"}${l.pg?'%':''}</span></td>
      <td>${l.placa||"—"}</td>
      <td><span class="badge ${vcls}">${vlab}</span></td>
    </tr>${extras.length ? `<tr><td colspan="8" style="padding-top:0;color:var(--ink-soft);font-size:11.5px;">${extras.join(" · ")}</td></tr>` : ""}`;
  }).join("");

  const obsList = m.obs && m.obs.length ? m.obs.join(" · ") : null;

  sheet.innerHTML = `
    <div class="sheet-head">
      <div><h2>${m.desc}${origenTag(m)}</h2><div class="art">Artículo ${m.art ?? "—"} · ${CROP_LABEL[m._crop]}</div></div>
      <button class="closebtn" id="closeBtn" aria-label="Cerrar">✕</button>
    </div>
    <div class="sheet-stats">
      <div class="box"><b>${fmtNum(m.ex)}</b>existencia total</div>
      <div class="box"><b style="color:var(--${pgcls==='gray'?'ink-soft':pgcls})">${pgtxt}</b>PG (rango)</div>
      <div class="box"><b>${m.lotes.length}</b>lote${m.lotes.length===1?'':'s'}</div>
      <div class="box"><b>${m.suc.length}</b>sucursal${m.suc.length===1?'':'es'}</div>
    </div>
    <div style="overflow-x:auto;">
    <table class="lots">
      <thead><tr>
        <th>Sucursal / Depósito</th><th>Lote</th><th>Estado</th><th>Exist.</th><th>Cond.</th><th>PG</th><th>Placa sugerida</th><th>Vencimiento</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>
    </div>
    ${obsList ? `<div class="obsbox"><b>Observaciones: </b>${obsList}</div>` : ""}
  `;
  document.getElementById('overlay').classList.add('open');
  document.getElementById('closeBtn').onclick = closeSheet;
}
function closeSheet(){ document.getElementById('overlay').classList.remove('open'); }
document.getElementById('overlay').addEventListener('click', (e)=>{ if(e.target.id==='overlay') closeSheet(); });
document.addEventListener('keydown', (e)=>{ if(e.key==='Escape') closeSheet(); });

document.getElementById('searchInput').addEventListener('input', (e)=>{
  state.search = e.target.value;
  renderAll();
});
document.getElementById('sortSel').addEventListener('change', (e)=>{
  state.sort = e.target.value;
  renderTable();
});

function renderAll(){
  renderTabs();
  renderStats();
  renderTable();
}

document.getElementById('metaInfo').textContent = "Actualizado " + DATA.__meta.fecha;
document.getElementById('footNote').textContent = "Datos cargados desde " + DATA.__meta.origen + " · " + DATA.__meta.totalLotes + " lotes con stock disponible en " + DATA.__meta.totalMateriales + " materiales.";

renderAll();
</script>
</body>
</html>
